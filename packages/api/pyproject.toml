[project]
name = "trajectory-api"
version = "0.1.0"
description = "Results service for the trajectory evaluation harness"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Ajay Mekala", email = "mekalaajayk@gmail.com" }]
dependencies = [
    "trajectory-core==0.1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7",
    "prometheus-client>=0.21",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trajectory_api"]
