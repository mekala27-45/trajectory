[project]
name = "trajectory-core"
version = "0.1.0"
description = "Schemas, trajectory scoring and failure mode classification for the trajectory harness"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Ajay Mekala", email = "mekalaajayk@gmail.com" }]
keywords = ["llm-evaluation", "agent-evaluation", "benchmark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.9",
    "structlog>=24.4",
]

[project.optional-dependencies]
judge = ["litellm>=1.59"]

[project.urls]
Homepage = "https://github.com/mekala27-45/trajectory"
Repository = "https://github.com/mekala27-45/trajectory"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trajectory_core"]
