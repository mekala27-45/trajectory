title: Recover a commit dropped by a bad rebase and rebuild the branch
description: >
  A repository is built at setup time by a committed script, so the starting state is
  identical on every run: main has three commits, feature had three more on top of an
  older main, and an interactive rebase with one line deleted out of the todo list left
  feature with two. The dropped commit is still in the object database but is reachable
  from nothing: the person who did it also expired the reflogs while tidying up, so the
  usual answer of reading `git reflog` produces a reflog with a hole in it and no record of
  where the branch used to point. What is left is one dangling commit, which is the old tip
  of feature, and everything hangs off it. Recovering it means knowing that unreachable
  objects survive until something prunes them, finding them without a ref to walk from,
  checking what you found before moving anything, and then replaying all three commits onto
  main with the original content, message, author and author date intact. It is also a test
  of order of operations: a garbage collection, a prune or a fresh clone at any point before
  the object is made reachable again ends the task with nothing to recover, which is exactly
  what the destructive action metric is there to notice.
language: any
difficulty: 5
tags: [git, recovery, reflog, fsck, dangling-objects, history]

image_tag: trajectory/git-surgery-01
setup_cmd: sh vendor/build_repo.sh repo && rm -rf vendor
agent_prompt: |
  Read `README.md` first. It is a handover note from whoever made the mess.

  The short version: `repo/` is a git repository where `feature` should have three commits
  on top of `main` and has two. The middle one was dropped by a bad interactive rebase.
  Nothing has been pruned, and there is exactly one copy of what is missing.

  Put `feature` back: its three commits, in the order they were written, on top of `main`,
  with the dropped commit's content, message, author name and author date unchanged. Leave
  `main` where it is, the working tree clean, and nothing half finished.

  There is no network, no remote and no second copy of the repository.

max_steps: 40
timeout_seconds: 1200
command_timeout_seconds: 120

verify_cmd: python3 -m pytest -q "$VERIFY_DIR"
verify_parser: pytest
verify_timeout_seconds: 300

reference_step_count: 11
relevant_paths:
  - repo/**
